<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin{% endblock %} — Ruchi</title>
<style>
  :root {
    --accent: #c0521f;
    --ink: #2b2420;
    --ink-soft: #8a8071;
    --surface-warm: #f7f0e3;
    --line: #f0e6d8;
    --green: #4c7256;
    --red: #b04a2c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #faf6ee;
    color: var(--ink);
  }
  a { text-decoration: none; color: inherit; }

  /* ===== Layout ===== */
  .admin-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 230px;
    background: var(--ink);
    color: #fff;
    flex-shrink: 0;
    padding: 24px 0;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .sidebar .logo {
    font-family: Georgia, serif;
    font-size: 1.5rem;
    font-weight: 800;
    padding: 0 24px 24px;
    display: block;
  }
  .sidebar .logo span { color: var(--accent); }
  .sidebar nav a {
    display: block;
    padding: 12px 24px;
    color: #cfc6b8;
    font-weight: 600;
    font-size: .95rem;
    border-left: 3px solid transparent;
  }
  .sidebar nav a:hover { background: rgba(255,255,255,.05); color: #fff; }
  .sidebar nav a.active {
    background: rgba(192,82,31,.15);
    color: #fff;
    border-left-color: var(--accent);
  }
  .sidebar .logout-link {
    margin-top: 30px;
    border-top: 1px solid rgba(255,255,255,.1);
    padding-top: 16px;
  }

  .main { flex: 1; padding: 32px 40px; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  .topbar h1 { margin: 0; font-size: 1.6rem; }
  .topbar .user-tag { color: var(--ink-soft); font-size: .9rem; }

  /* ===== Flash messages ===== */
  .flash { padding: 12px 18px; border-radius: 10px; margin-bottom: 20px; font-size: .92rem; font-weight: 600; }
  .flash.success { background: #eaf3ea; color: var(--green); }
  .flash.error { background: #fbeae2; color: var(--red); }

  /* ===== Cards / tables ===== */
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: .92rem; }
  th { color: var(--ink-soft); font-weight: 700; text-transform: uppercase; font-size: .75rem; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  img.thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-block;
    padding: 9px 18px;
    border-radius: 24px;
    font-weight: 700;
    font-size: .88rem;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #a5451a; }
  .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn-outline:hover { background: var(--surface-warm); }
  .btn-danger { background: #fbeae2; color: var(--red); }
  .btn-danger:hover { background: #f6d9c9; }
  .btn-sm { padding: 6px 12px; font-size: .8rem; }

  /* ===== Status pills ===== */
  .pill { padding: 4px 12px; border-radius: 20px; font-size: .78rem; font-weight: 700; display: inline-block; }
  .pill.Placed { background: #fff3d6; color: #97690a; }
  .pill.Preparing { background: #e3ecf7; color: #2f5b9c; }
  .pill.Out-for-Delivery { background: #efe3f7; color: #6b3f9c; }
  .pill.Delivered { background: #eaf3ea; color: var(--green); }
  .pill.Cancelled { background: #fbeae2; color: var(--red); }

  /* ===== Stat cards ===== */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 28px; }
  .stat-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .stat-card .label { color: var(--ink-soft); font-size: .82rem; font-weight: 600; margin-bottom: 6px; }
  .stat-card .value { font-size: 1.7rem; font-weight: 800; }

  /* ===== Forms ===== */
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-weight: 700; font-size: .85rem; margin-bottom: 6px; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px;
    font-size: .92rem; font-family: inherit;
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
</style>
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <a href="{{ url_for('admin.dashboard') }}" class="logo">Ru<span>chi</span> Admin</a>
    <nav>
      <a href="{{ url_for('admin.dashboard') }}" class="{{ 'active' if request.endpoint == 'admin.dashboard' else '' }}">📊 Dashboard</a>
      <a href="{{ url_for('admin.products') }}" class="{{ 'active' if request.endpoint in ['admin.products', 'admin.add_product', 'admin.edit_product'] else '' }}">🍽️ Products</a>
      <a href="{{ url_for('admin.orders') }}" class="{{ 'active' if request.endpoint == 'admin.orders' else '' }}">📦 Orders</a>
      <a href="{{ url_for('admin.logout') }}" class="logout-link">🚪 Logout</a>
    </nav>
  </aside>

  <main class="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
