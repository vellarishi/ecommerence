<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Ruchi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2b2420;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .login-card {
    background: #fff;
    padding: 40px;
    border-radius: 16px;
    width: 100%;
    max-width: 360px;
  }
  .logo {
    font-family: Georgia, serif;
    font-size: 1.8rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: 6px;
  }
  .logo span { color: #c0521f; }
  .subtitle { text-align: center; color: #8a8071; font-size: .9rem; margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-weight: 700; font-size: .85rem; margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 14px; border: 1px solid #f0e6d8; border-radius: 10px; font-size: .95rem;
  }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 24px; background: #c0521f; color: #fff;
    font-weight: 700; font-size: .95rem; cursor: pointer; margin-top: 8px;
  }
  button:hover { background: #a5451a; }
  .flash { padding: 10px 14px; border-radius: 10px; background: #fbeae2; color: #b04a2c; font-size: .85rem; margin-bottom: 16px; font-weight: 600; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo">Ru<span>chi</span></div>
    <div class="subtitle">Admin Panel Login</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit">Log In</button>
    </form>
  </div>
</body>
</html>
