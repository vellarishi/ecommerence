{% extends "admin/base.html" %}
{% block title %}{{ 'Edit Product' if product else 'Add Product' }}{% endblock %}

{% block content %}
<div class="topbar">
  <h1>{{ 'Edit Product' if product else 'Add Product' }}</h1>
  <a href="{{ url_for('admin.products') }}" class="btn btn-outline">← Back to Products</a>
</div>

<div class="card" style="max-width:640px;">
  <form method="POST">
    <div class="form-group">
      <label>Product / Restaurant Name</label>
      <input type="text" name="name" required value="{{ product.name if product else '' }}">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Cuisine</label>
        <input type="text" name="cuisine" required placeholder="e.g. South Indian"
               value="{{ product.cuisine if product else '' }}">
      </div>
      <div class="form-group">
        <label>Price (₹)</label>
        <input type="number" name="price_value" required min="0"
               value="{{ product.price_value if product else '' }}">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Rating (0–5)</label>
        <input type="number" name="rating" step="0.1" min="0" max="5"
               value="{{ product.rating if product else 4.0 }}">
      </div>
      <div class="form-group">
        <label>Delivery Time</label>
        <input type="text" name="delivery_time" placeholder="e.g. 30-40 min"
               value="{{ product.delivery_time if product else '30-40 min' }}">
      </div>
    </div>

    <div class="form-group">
      <label>Image URL</label>
      <input type="url" name="image_url" placeholder="https://…"
             value="{{ product.image_url if product else '' }}">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea name="description" rows="3">{{ product.description if product else '' }}</textarea>
    </div>

    {% if product %}
    <div class="form-group">
      <label style="display:flex; align-items:center; gap:8px; font-weight:600;">
        <input type="checkbox" name="is_active" style="width:auto;" {{ 'checked' if product.is_active else '' }}>
        Visible on the site
      </label>
    </div>
    {% endif %}

    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if product else 'Add Product' }}</button>
  </form>
</div>
{% endblock %}
