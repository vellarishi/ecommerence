<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants — RUCHI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Ru<span>chi</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurants.html" class="active">Restaurants</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="favorites.html">Favorites</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <a href="favorites.html" class="icon-btn">♥</a>
        <a href="cart.html" class="icon-btn">
          🛒<span class="badge" id="cartCount">0</span>
        </a>
        <a href="login.html" class="btn btn-dark btn-sm">Login</a>
      </div>
    </div>
  </nav>

  <!-- Hero / search -->
  <section class="page-header">
    <div class="container">
      <span class="eyebrow">500+ Partners Near You</span>
      <h1 style="margin-top:12px;">Find your next meal</h1>
      <div class="search-bar search-bar-lg" style="margin-top:26px;">
        <span style="padding-left:10px;">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by restaurant name or cuisine...">
      </div>
    </div>
  </section>

  <!-- Filters + results -->
  <section class="section" style="padding-top:34px;">
    <div class="container">
      <div class="filter-row" id="filterRow">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="South Indian">South Indian</button>
        <button class="filter-chip" data-filter="North Indian">North Indian</button>
        <button class="filter-chip" data-filter="Chinese">Asian</button>
        <button class="filter-chip" data-filter="Italian">Italian</button>
        <button class="filter-chip" data-filter="Healthy">Healthy</button>
        <button class="filter-chip" data-filter="Desserts">Desserts</button>
      </div>

      <p class="result-count" id="resultCount" style="margin:24px 0 8px;"></p>

      <div id="restaurantGrid"></div>
    </div>
  </section>

  <script>
    let restaurants = [
      {
        id: 101, name: "Chettinad Corner", cuisine: "South Indian",
        priceValue: 280, rating: 4.6, deliveryTime: "25-35 min",
        image: "https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=400&h=300&fit=crop"
      },
      {
        id: 102, name: "Momo Street", cuisine: "Chinese",
        priceValue: 220, rating: 4.3, deliveryTime: "20-30 min",
        image: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=400&h=300&fit=crop"
      },
      {
        id: 103, name: "The Curry House", cuisine: "North Indian",
        priceValue: 350, rating: 4.4, deliveryTime: "30-40 min",
        image: "https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=400&h=300&fit=crop"
      },
      {
        id: 104, name: "Sushi Bay", cuisine: "Italian",
        priceValue: 500, rating: 4.7, deliveryTime: "35-45 min",
        image: "https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?w=400&h=300&fit=crop"
      },
      {
        id: 105, name: "Green Bowl", cuisine: "Healthy",
        priceValue: 260, rating: 4.5, deliveryTime: "20-25 min",
        image: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=400&h=300&fit=crop"
      },
      {
        id: 106, name: "Tandoor Nights", cuisine: "North Indian",
        priceValue: 380, rating: 4.2, deliveryTime: "30-40 min",
        image: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=400&h=300&fit=crop"
      },
      {
        id: 107, name: "Cafe Mocha", cuisine: "Desserts",
        priceValue: 180, rating: 4.6, deliveryTime: "15-25 min",
        image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400&h=300&fit=crop"
      },
      {
        id: 108, name: "Andhra Mess", cuisine: "South Indian",
        priceValue: 240, rating: 4.4, deliveryTime: "25-35 min",
        image: "https://images.unsplash.com/photo-1567188040759-fb8a883dc6d8?w=400&h=300&fit=crop"
      },
      {
        id: 109, name: "Noodle Bar", cuisine: "Chinese",
        priceValue: 300, rating: 4.3, deliveryTime: "25-30 min",
        image: "https://images.unsplash.com/photo-1585032226651-759b368d7246?w=400&h=300&fit=crop"
      },
      {
        id: 110, name: "Sweet Tooth", cuisine: "Desserts",
        priceValue: 150, rating: 4.8, deliveryTime: "20-30 min",
        image: "https://images.unsplash.com/photo-1550617931-e17a7b70dce2?w=400&h=300&fit=crop"
      }
    ];

    let activeFilter = "all";
    let searchQuery = "";

    function renderRestaurants() {
      let filtered = restaurants;

      if (activeFilter !== "all") {
        filtered = filtered.filter(r => r.cuisine === activeFilter);
      }
      if (searchQuery) {
        filtered = filtered.filter(r =>
          r.name.toLowerCase().includes(searchQuery) ||
          r.cuisine.toLowerCase().includes(searchQuery)
        );
      }

      document.getElementById("resultCount").textContent = `${filtered.length} restaurants found`;

      const grid = document.getElementById("restaurantGrid");
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="emoji">🍽️</div>
            <h3>No restaurants found</h3>
            <p>Try a different search or filter.</p>
          </div>`;
        return;
      }

      grid.innerHTML = `<div class="grid grid-4">` +
        filtered.map(r => `
          <div class="card">
            <div class="card-media">
              <img src="${r.image}" alt="${r.name}">
              <button class="fav-btn" data-id="${r.id}" title="Add to favorites">♡</button>
            </div>
            <div class="card-body">
              <h3>${r.name}</h3>
              <div class="card-meta">
                <span class="rating-badge">${r.rating}</span>
                <span>${r.cuisine}</span>
                <span>${r.deliveryTime}</span>
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <p class="price-tag">₹${r.priceValue}</p>
                <button class="btn btn-primary btn-sm add-to-cart" data-id="${r.id}">Add to Cart</button>
              </div>
            </div>
          </div>
        `).join("") +
        `</div>`;

      attachCardListeners();
    }

    function attachCardListeners() {
      document.querySelectorAll(".fav-btn").forEach(btn => {
        btn.addEventListener("click", function () {
          this.classList.toggle("active");
          this.textContent = this.classList.contains("active") ? "♥" : "♡";
        });
      });

      document.querySelectorAll(".add-to-cart").forEach(btn => {
        btn.addEventListener("click", function () {
          const id = this.getAttribute("data-id");
          const item = restaurants.find(r => r.id == id);
          if (!item) return;

          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          cart.push(item);
          localStorage.setItem("cart", JSON.stringify(cart));

          const cartCountEl = document.getElementById("cartCount");
          if (cartCountEl) cartCountEl.textContent = cart.length;

          const original = this.textContent;
          this.textContent = "Added ✓";
          setTimeout(() => { this.textContent = original; }, 1000);
        });
      });
    }

    document.querySelectorAll(".filter-chip").forEach(chip => {
      chip.addEventListener("click", function () {
        document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
        this.classList.add("active");
        activeFilter = this.getAttribute("data-filter");
        renderRestaurants();
      });
    });

    document.getElementById("searchInput").addEventListener("input", function () {
      searchQuery = this.value.toLowerCase();
      renderRestaurants();
    });

    const existingCart = JSON.parse(localStorage.getItem("cart")) || [];
    const cartCountEl = document.getElementById("cartCount");
    if (cartCountEl) cartCountEl.textContent = existingCart.length;

    renderRestaurants();
  </script>
  <script src="js/navbar.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
