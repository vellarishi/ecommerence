<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants — RUCHI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Ru<span>chi</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurants.html" class="active">Restaurants</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="favorites.html">Favorites</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <a href="favorites.html" class="icon-btn">♥</a>
        <a href="cart.html" class="icon-btn">
          🛒<span class="badge" id="cartCount">0</span>
        </a>
        <a href="login.html" class="btn btn-dark btn-sm">Login</a>
      </div>
    </div>
  </nav>

  <!-- Hero / search -->
  <section class="page-header">
    <div class="container">
      <span class="eyebrow">500+ Partners Near You</span>
      <h1 style="margin-top:12px;">Find your next meal</h1>
      <div class="search-bar search-bar-lg" style="margin-top:26px;">
        <span style="padding-left:10px;">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by restaurant name or cuisine...">
      </div>
    </div>
  </section>

  <!-- Filters + results -->
  <section class="section" style="padding-top:34px;">
    <div class="container">
      <div class="filter-row" id="filterRow">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="South Indian">South Indian</button>
        <button class="filter-chip" data-filter="North Indian">North Indian</button>
        <button class="filter-chip" data-filter="Chinese">Asian</button>
        <button class="filter-chip" data-filter="Italian">Italian</button>
        <button class="filter-chip" data-filter="Healthy">Healthy</button>
        <button class="filter-chip" data-filter="Desserts">Desserts</button>
      </div>

      <p class="result-count" id="resultCount" style="margin:24px 0 8px;"></p>

      <div id="restaurantGrid"></div>
    </div>
  </section>

  <script>
    const API_BASE = "https://ecommerence-3lrk.onrender.com/api";

    const LOCAL_RESTAURANTS = [
      { id: "local-1", name: "Curry Leaf", cuisine: "South Indian", rating: 4.6, deliveryTime: "25-35 min", priceValue: 220, image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=600&h=400&fit=crop" },
      { id: "local-2", name: "Punjabi Tadka", cuisine: "North Indian", rating: 4.4, deliveryTime: "30-40 min", priceValue: 280, image: "https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=600&h=400&fit=crop" },
      { id: "local-3", name: "Golden Dragon", cuisine: "Chinese", rating: 4.1, deliveryTime: "35-45 min", priceValue: 320, image: "https://images.unsplash.com/photo-1512058564366-18510be2db19?w=600&h=400&fit=crop" },
      { id: "local-4", name: "Bella Napoli", cuisine: "Italian", rating: 4.7, deliveryTime: "25-30 min", priceValue: 400, image: "https://images.unsplash.com/photo-1595854341625-f33ee10dbf94?w=600&h=400&fit=crop" },
      { id: "local-5", name: "Green Bowl", cuisine: "Healthy", rating: 4.8, deliveryTime: "20-30 min", priceValue: 260, image: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=600&h=400&fit=crop" },
      { id: "local-6", name: "Sugar Rush", cuisine: "Desserts", rating: 4.5, deliveryTime: "15-25 min", priceValue: 180, image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?w=600&h=400&fit=crop" },
      { id: "local-7", name: "Momo Point", cuisine: "Chinese", rating: 4.3, deliveryTime: "20-30 min", priceValue: 200, image: "https://images.unsplash.com/photo-1626804475297-41608ea09aeb?w=600&h=400&fit=crop" },
      { id: "local-8", name: "Tandoor Nights", cuisine: "North Indian", rating: 4.6, deliveryTime: "30-40 min", priceValue: 310, image: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=600&h=400&fit=crop" },
      { id: "local-9", name: "Choco Bliss", cuisine: "Desserts", rating: 4.9, deliveryTime: "15-20 min", priceValue: 150, image: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=600&h=400&fit=crop" },
      { id: "local-10", name: "Saffron South", cuisine: "South Indian", rating: 4.5, deliveryTime: "25-35 min", priceValue: 240, image: "https://images.unsplash.com/photo-1601050690597-df0568f70950?w=600&h=400&fit=crop" },
      { id: "local-11", name: "Royal Mughal", cuisine: "North Indian", rating: 4.7, deliveryTime: "30-45 min", priceValue: 350, image: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=600&h=400&fit=crop" },
      { id: "local-12", name: "Wok Express", cuisine: "Chinese", rating: 4.2, deliveryTime: "25-35 min", priceValue: 260, image: "https://images.unsplash.com/photo-1552611052-33e04de081de?w=600&h=400&fit=crop" },
      { id: "local-13", name: "Pasta Villa", cuisine: "Italian", rating: 4.6, deliveryTime: "20-30 min", priceValue: 380, image: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=600&h=400&fit=crop" },
      { id: "local-14", name: "Fit Kitchen", cuisine: "Healthy", rating: 4.7, deliveryTime: "15-25 min", priceValue: 290, image: "https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=600&h=400&fit=crop" },
      { id: "local-15", name: "Cake Corner", cuisine: "Desserts", rating: 4.8, deliveryTime: "15-20 min", priceValue: 190, image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600&h=400&fit=crop" },
      { id: "local-16", name: "Sizzle Street", cuisine: "Fast Food", rating: 4.4, deliveryTime: "20-30 min", priceValue: 210, image: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=600&h=400&fit=crop" }
    ];

    const FALLBACK_IMAGES = {
      "South Indian": "https://images.unsplash.com/photo-1630383249896-424e482df921?w=600&h=400&fit=crop",
      "North Indian": "https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=600&h=400&fit=crop",
      "Chinese": "https://images.unsplash.com/photo-1585032226651-759b368d7246?w=600&h=400&fit=crop",
      "Italian": "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600&h=400&fit=crop",
      "Fast Food": "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&h=400&fit=crop",
      "Healthy": "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600&h=400&fit=crop",
      "Desserts": "https://images.unsplash.com/photo-1551024506-0bccd828d307?w=600&h=400&fit=crop",
      "default": "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&h=400&fit=crop"
    };

    function handleImageError(imgEl, cuisine) {
      imgEl.onerror = null;
      imgEl.src = FALLBACK_IMAGES[cuisine] || FALLBACK_IMAGES["default"];
    }

    let restaurants = [];
    let activeFilter = "all";
    let searchQuery = "";

    async function loadRestaurants() {
      // Show the 16 local restaurants immediately — no waiting on the
      // backend. This is what fixes the "slow to open" feeling.
      restaurants = [...LOCAL_RESTAURANTS];
      renderRestaurants();

      // Then fetch the database restaurants in the background and
      // merge them in once they arrive (could take 30-50s if the
      // Render backend was asleep — but the page is already usable).
      try {
        const res = await fetch(`${API_BASE}/products`);
        if (!res.ok) throw new Error(`Server responded ${res.status}`);
        const apiRestaurants = await res.json();
        restaurants = [...apiRestaurants, ...LOCAL_RESTAURANTS];
        renderRestaurants();
      } catch (err) {
        console.error("Failed to load restaurants from API:", err);
        // Local restaurants are already showing — nothing more to do.
      }
    }

    function renderRestaurants() {
      let filtered = restaurants;

      if (activeFilter !== "all") {
        filtered = filtered.filter(r => r.cuisine === activeFilter);
      }
      if (searchQuery) {
        filtered = filtered.filter(r =>
          r.name.toLowerCase().includes(searchQuery) ||
          r.cuisine.toLowerCase().includes(searchQuery)
        );
      }

      document.getElementById("resultCount").textContent = `${filtered.length} restaurants found`;

      const grid = document.getElementById("restaurantGrid");
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="emoji">🍽️</div>
            <h3>No restaurants found</h3>
            <p>Try a different search or filter.</p>
          </div>`;
        return;
      }

      grid.innerHTML = `<div class="grid grid-4">` +
        filtered.map(r => `
          <div class="card">
            <div class="card-media">
              <img src="${r.image}" alt="${r.name}" loading="lazy" onerror="handleImageError(this, '${r.cuisine}')">
              <button class="fav-btn" data-id="${r.id}" title="Add to favorites">♡</button>
            </div>
            <div class="card-body">
              <h3>${r.name}</h3>
              <div class="card-meta">
                <span class="rating-badge">${r.rating}</span>
                <span>${r.cuisine}</span>
                <span>${r.deliveryTime}</span>
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <p class="price-tag">₹${r.priceValue}</p>
                <button class="btn btn-primary btn-sm add-to-cart" data-id="${r.id}">Add to Cart</button>
              </div>
            </div>
          </div>
        `).join("") +
        `</div>`;

      attachCardListeners();
    }

    function attachCardListeners() {
      document.querySelectorAll(".fav-btn").forEach(btn => {
        btn.addEventListener("click", function () {
          this.classList.toggle("active");
          this.textContent = this.classList.contains("active") ? "♥" : "♡";
        });
      });

      document.querySelectorAll(".add-to-cart").forEach(btn => {
        btn.addEventListener("click", function () {
          const id = this.getAttribute("data-id");
          const item = restaurants.find(r => r.id == id);
          if (!item) return;

          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          cart.push(item);
          localStorage.setItem("cart", JSON.stringify(cart));

          const cartCountEl = document.getElementById("cartCount");
          if (cartCountEl) cartCountEl.textContent = cart.length;

          const original = this.textContent;
          this.textContent = "Added ✓";
          setTimeout(() => { this.textContent = original; }, 1000);
        });
      });
    }

    document.querySelectorAll(".filter-chip").forEach(chip => {
      chip.addEventListener("click", function () {
        document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
        this.classList.add("active");
        activeFilter = this.getAttribute("data-filter");
        renderRestaurants();
      });
    });

    document.getElementById("searchInput").addEventListener("input", function () {
      searchQuery = this.value.toLowerCase();
      renderRestaurants();
    });

    const existingCart = JSON.parse(localStorage.getItem("cart")) || [];
    const cartCountEl = document.getElementById("cartCount");
    if (cartCountEl) cartCountEl.textContent = existingCart.length;

    loadRestaurants();
  </script>
  <script src="js/navbar.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
