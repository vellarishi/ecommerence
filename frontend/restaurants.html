<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants — RUCHI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Ru<span>chi</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurants.html" class="active">Restaurants</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="favorites.html">Favorites</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <a href="favorites.html" class="icon-btn">♥</a>
        <a href="cart.html" class="icon-btn">
          🛒<span class="badge" id="cartCount">0</span>
        </a>
        <a href="login.html" class="btn btn-dark btn-sm">Login</a>
      </div>
      <button class="nav-toggle" aria-label="Menu"><span></span></button>
    </div>
  </nav>

  <!-- Hero / search -->
  <section class="page-header">
    <div class="container">
      <span class="eyebrow">500+ Partners Near You</span>
      <h1 style="margin-top:12px;">Find your next meal</h1>
      <div class="search-bar search-bar-lg" style="margin-top:26px;">
        <span style="padding-left:10px;">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by restaurant name or cuisine...">
      </div>
    </div>
  </section>

  <!-- Filters + results -->
  <section class="section" style="padding-top:34px;">
    <div class="container">
      <div class="filter-row" id="filterRow">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="South Indian">South Indian</button>
        <button class="filter-chip" data-filter="North Indian">North Indian</button>
        <button class="filter-chip" data-filter="Chinese">Asian</button>
        <button class="filter-chip" data-filter="Italian">Italian</button>
        <button class="filter-chip" data-filter="Healthy">Healthy</button>
        <button class="filter-chip" data-filter="Desserts">Desserts</button>
      </div>

      <p class="result-count" id="resultCount" style="margin:24px 0 8px;"></p>

      <div id="restaurantGrid"></div>
    </div>
  </section>

  <script>
    const API_BASE = "https://ecommerence-3lrk.onrender.com/api";

    const FALLBACK_IMAGES = {
      "South Indian": "https://images.unsplash.com/photo-1630383249896-424e482df921?w=600&h=400&fit=crop",
      "North Indian": "https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=600&h=400&fit=crop",
      "Chinese": "https://images.unsplash.com/photo-1585032226651-759b368d7246?w=600&h=400&fit=crop",
      "Italian": "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600&h=400&fit=crop",
      "Fast Food": "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&h=400&fit=crop",
      "Healthy": "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600&h=400&fit=crop",
      "Desserts": "https://images.unsplash.com/photo-1551024506-0bccd828d307?w=600&h=400&fit=crop",
      "default": "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&h=400&fit=crop"
    };

    function handleImageError(imgEl, cuisine) {
      imgEl.onerror = null;
      imgEl.src = FALLBACK_IMAGES[cuisine] || FALLBACK_IMAGES["default"];
    }

    let restaurants = [];
    let activeFilter = "all";
    let searchQuery = "";

    async function loadRestaurants() {
      try {
        const res = await fetch(`${API_BASE}/products`);
        if (!res.ok) throw new Error(`Server responded ${res.status}`);
        restaurants = await res.json();
        renderRestaurants();
      } catch (err) {
        console.error("Failed to load restaurants from API:", err);
        document.getElementById("resultCount").textContent = "Couldn't load restaurants — is the backend running?";
      }
    }

    function renderRestaurants() {
      let filtered = restaurants;

      if (activeFilter !== "all") {
        filtered = filtered.filter(r => r.cuisine === activeFilter);
      }
      if (searchQuery) {
        filtered = filtered.filter(r =>
          r.name.toLowerCase().includes(searchQuery) ||
          r.cuisine.toLowerCase().includes(searchQuery)
        );
      }

      document.getElementById("resultCount").textContent = `${filtered.length} restaurants found`;

      const grid = document.getElementById("restaurantGrid");
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="emoji">🍽️</div>
            <h3>No restaurants found</h3>
            <p>Try a different search or filter.</p>
          </div>`;
        return;
      }

      grid.innerHTML = `<div class="grid grid-4">` +
        filtered.map(r => `
          <div class="card">
            <div class="card-media">
              <img src="${r.image_url}" alt="${r.name}" loading="lazy" onerror="handleImageError(this, '${r.cuisine}')">
              <button class="fav-btn" data-id="${r.id}" title="Add to favorites">♡</button>
            </div>
            <div class="card-body">
              <h3>${r.name}</h3>
              <div class="card-meta">
                <span class="rating-badge">${r.rating}</span>
                <span>${r.cuisine}</span>
                <span>${r.deliveryTime}</span>
              </div>
              <div class="card-actions">
                <p class="price-tag">₹${r.priceValue}</p>
                <button class="btn btn-primary btn-sm add-to-cart" data-id="${r.id}">Add to Cart</button>
              </div>
            </div>
          </div>
        `).join("") +
        `</div>`;

      attachCardListeners();
    }

    function attachCardListeners() {
      document.querySelectorAll(".fav-btn").forEach(btn => {
        btn.addEventListener("click", function () {
          this.classList.toggle("active");
          this.textContent = this.classList.contains("active") ? "♥" : "♡";
        });
      });

      document.querySelectorAll(".add-to-cart").forEach(btn => {
        btn.addEventListener("click", function () {
          const id = this.getAttribute("data-id");
          const item = restaurants.find(r => r.id == id);
          if (!item) return;

          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          cart.push(item);
          localStorage.setItem("cart", JSON.stringify(cart));

          const cartCountEl = document.getElementById("cartCount");
          if (cartCountEl) cartCountEl.textContent = cart.length;

          const original = this.textContent;
          this.textContent = "Added ✓";
          setTimeout(() => { this.textContent = original; }, 1000);
        });
      });
    }

    document.querySelectorAll(".filter-chip").forEach(chip => {
      chip.addEventListener("click", function () {
        document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
        this.classList.add("active");
        activeFilter = this.getAttribute("data-filter");
        renderRestaurants();
      });
    });

    document.getElementById("searchInput").addEventListener("input", function () {
      searchQuery = this.value.toLowerCase();
      renderRestaurants();
    });

    const existingCart = JSON.parse(localStorage.getItem("cart")) || [];
    const cartCountEl = document.getElementById("cartCount");
    if (cartCountEl) cartCountEl.textContent = existingCart.length;

    loadRestaurants();
  </script>
  <script src="js/navbar.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
