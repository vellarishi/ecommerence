<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .orders-stats{
      display:grid; grid-template-columns:repeat(3,1fr); gap:20px;
      margin:34px 0 40px;
    }
    .stat-box{
      background:#ffffff; border:1px solid #f0e6d8; border-radius:14px;
      padding:22px 24px; box-shadow:0 2px 10px rgba(43,36,32,0.05);
    }
    .stat-box .stat-label{
      font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
      color:#8a7d6c; margin-bottom:8px;
    }
    .stat-box .stat-value{
      font-family:Georgia, serif; font-size:1.8rem; font-weight:700; color:#2b2420;
    }
    .stat-box.accent .stat-value{ color:#c0521f; }

    .order-card-pro{
      background:#ffffff; border:1px solid #f0e6d8; border-radius:14px;
      padding:0; margin-bottom:22px; overflow:hidden;
      box-shadow:0 2px 10px rgba(43,36,32,0.05); transition:transform .18s ease, box-shadow .18s ease;
      display:flex;
    }
    .order-card-pro:hover{ transform:translateY(-3px); box-shadow:0 10px 26px rgba(43,36,32,0.1); }

    .order-accent{ width:6px; flex-shrink:0; }
    .order-accent.delivered{ background:#1f8b4c; }
    .order-accent.placed{ background:#2563b8; }
    .order-accent.preparing{ background:#c07d10; }
    .order-accent.out-for-delivery{ background:#c0521f; }
    .order-accent.cancelled{ background:#c0392b; }

    .order-card-body{ padding:22px 26px; flex:1; }

    .order-card-top{
      display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px;
    }
    .order-id-row{ display:flex; align-items:center; gap:12px; }
    .order-avatar{
      width:42px; height:42px; border-radius:50%; background:#fdeee0; color:#c0521f;
      display:flex; align-items:center; justify-content:center; font-weight:800; font-family:Georgia, serif;
      font-size:1rem; flex-shrink:0;
    }
    .order-id-text h3{ font-size:1.02rem; margin-bottom:2px; color:#2b2420; }
    .order-id-text .order-date{ font-size:.8rem; color:#8a7d6c; }

    .status-pill{
      font-size:.72rem; font-weight:700; letter-spacing:.03em;
      padding:6px 14px; border-radius:20px; white-space:nowrap;
      display:inline-flex; align-items:center; gap:6px;
    }
    .status-pill::before{ content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
    .status-pill.delivered{ background:#e5f5ea; color:#1f8b4c; }
    .status-pill.placed{ background:#eaf1fb; color:#2563b8; }
    .status-pill.preparing{ background:#fff4e0; color:#c07d10; }
    .status-pill.out-for-delivery{ background:#fdeee0; color:#c0521f; }
    .status-pill.cancelled{ background:#fbe9e9; color:#c0392b; }

    .order-items-pro{ list-style:none; padding:0; margin:14px 0; border-top:1px solid #f5efe4; }
    .order-items-pro li{
      display:flex; justify-content:space-between; padding:10px 0;
      border-bottom:1px dashed #f0e6d8; font-size:.9rem; color:#5a5148;
    }
    .order-items-pro li:last-child{ border-bottom:none; }
    .order-items-pro li span.item-price{ font-weight:700; color:#2b2420; }

    .order-card-footer{
      display:flex; justify-content:space-between; align-items:center; padding-top:12px;
    }
    .order-total-pro{ font-family:Georgia, serif; font-size:1.15rem; font-weight:700; color:#2b2420; }
    .reorder-btn{
      font-size:.82rem; font-weight:700; color:#c0521f; border:1.5px solid #fdeee0;
      padding:8px 16px; border-radius:20px; background:transparent; cursor:pointer; transition:.15s;
    }
    .reorder-btn:hover{ background:#c0521f; color:#fff; border-color:#c0521f; }

    .lookup-bar{
      display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;
      background:#fff; border:1px solid #f0e6d8; border-radius:14px; padding:18px 22px; margin-top:24px;
    }
    .lookup-bar .field{ flex:1; min-width:220px; }
    .lookup-bar label{ display:block; font-size:.78rem; font-weight:700; color:#8a7d6c; margin-bottom:6px; }
    .lookup-bar input{
      width:100%; padding:10px 14px; border:1px solid #f0e6d8; border-radius:10px; font-size:.92rem; box-sizing:border-box;
    }
    .lookup-bar button{
      padding:10px 22px; border:none; border-radius:24px; background:#c0521f; color:#fff;
      font-weight:700; font-size:.9rem; cursor:pointer;
    }
    .lookup-bar button:hover{ background:#a5451a; }
    .lookup-note{ font-size:.82rem; color:#8a7d6c; margin-top:8px; }

    @media (max-width:680px){
      .orders-stats{ grid-template-columns:1fr; }
      .order-card-top{ flex-direction:column; }
    }
  </style>
</head>
<body>
<header class="navbar">
  <div class="container">
    <a href="index.html" class="logo">Ru<span>chi</span></a>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="restaurants.html">Restaurants</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="orders.html" class="active">Orders</a></li>
      <li><a href="favorites.html">Favorites</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <a href="favorites.html" class="icon-btn" aria-label="Favorites">♡</a>
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        🛒<span class="badge" id="cartCount">0</span>
      </a>
      <a href="login.html" class="btn btn-dark btn-sm">Login</a>
    </div>

    <button class="nav-toggle" aria-label="Menu"><span></span></button>
  </div>
</header>

  <main class="container section">
    <h1>My Orders</h1>

    <div class="lookup-bar">
      <div class="field">
        <label for="lookupPhone">Look up orders by phone number</label>
        <input type="tel" id="lookupPhone" placeholder="Enter your 10-digit phone number">
      </div>
      <button id="lookupBtn">Track Orders</button>
    </div>
    <p class="lookup-note" id="lookupNote"></p>

    <div class="orders-stats" id="ordersStats"></div>
    <div id="ordersList"></div>
  </main>

  <script>
    const API_BASE = "https://ecommerence-3lrk.onrender.com/api";

    const statusMeta = {
      "Placed":            { cls: "placed",            label: "Order Placed" },
      "Preparing":         { cls: "preparing",          label: "Preparing" },
      "Out for Delivery":  { cls: "out-for-delivery",   label: "Out for Delivery" },
      "Delivered":         { cls: "delivered",          label: "Delivered" },
      "Cancelled":         { cls: "cancelled",          label: "Cancelled" }
    };

    function getInitials(name) {
      return (name || "?").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
    }

    function renderStats(orders) {
      const statsContainer = document.getElementById("ordersStats");
      const totalOrders = orders.length;
      const totalSpent = orders
        .filter(o => o.status !== "Cancelled")
        .reduce((sum, o) => sum + o.total, 0);
      const deliveredCount = orders.filter(o => o.status === "Delivered").length;

      statsContainer.innerHTML = `
        <div class="stat-box">
          <div class="stat-label">Total Orders</div>
          <div class="stat-value">${totalOrders}</div>
        </div>
        <div class="stat-box accent">
          <div class="stat-label">Total Spent</div>
          <div class="stat-value">₹${totalSpent}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Delivered</div>
          <div class="stat-value">${deliveredCount}</div>
        </div>
      `;
    }

    function renderOrdersPro(orders) {
      const container = document.getElementById("ordersList");

      if (orders.length === 0) {
        container.innerHTML = `<p>No orders yet. Start browsing <a href="restaurants.html">restaurants</a>!</p>`;
        return;
      }

      container.innerHTML = orders.map(order => {
        const meta = statusMeta[order.status] || { cls: "placed", label: order.status };
        return `
          <div class="order-card-pro">
            <div class="order-accent ${meta.cls}"></div>
            <div class="order-card-body">
              <div class="order-card-top">
                <div class="order-id-row">
                  <div class="order-avatar">${getInitials(order.customerName)}</div>
                  <div class="order-id-text">
                    <h3>Order #${order.id} — ${order.customerName}</h3>
                    <div class="order-date">${order.date}</div>
                  </div>
                </div>
                <span class="status-pill ${meta.cls}">${meta.label}</span>
              </div>

              <ul class="order-items-pro">
                ${order.items.map(item => `
                  <li>
                    <span>${item.name}${item.quantity > 1 ? ` × ${item.quantity}` : ""}</span>
                    <span class="item-price">₹${item.priceValue * item.quantity}</span>
                  </li>
                `).join("")}
              </ul>

              <div class="order-card-footer">
                <span class="order-total-pro">Total: ₹${order.total}</span>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function loadOrdersForPhone(phone) {
      const note = document.getElementById("lookupNote");
      note.textContent = "Loading your orders…";

      try {
        const res = await fetch(`${API_BASE}/orders?phone=${encodeURIComponent(phone)}`);
        if (!res.ok) throw new Error(`Server responded ${res.status}`);
        const orders = await res.json();

        note.textContent = orders.length === 0
          ? `No orders found for ${phone}.`
          : "";

        renderStats(orders);
        renderOrdersPro(orders);
      } catch (err) {
        console.error("Failed to load orders:", err);
        note.textContent = `Couldn't load orders — is the backend server running? (${err.message})`;
        renderStats([]);
        renderOrdersPro([]);
      }
    }

    document.getElementById("lookupBtn").addEventListener("click", function () {
      const phone = document.getElementById("lookupPhone").value.trim();
      if (!phone) {
        document.getElementById("lookupNote").textContent = "Please enter a phone number.";
        return;
      }
      localStorage.setItem("ruchiPhone", phone);
      loadOrdersForPhone(phone);
    });

    const savedPhone = localStorage.getItem("ruchiPhone");
    if (savedPhone) {
      document.getElementById("lookupPhone").value = savedPhone;
      loadOrdersForPhone(savedPhone);
    } else {
      renderStats([]);
      renderOrdersPro([]);
      document.getElementById("lookupNote").textContent = "Enter your phone number above to see your orders.";
    }

    const existingCart = JSON.parse(localStorage.getItem("cart")) || [];
    const cartCountEl = document.getElementById("cartCount");
    if (cartCountEl) cartCountEl.textContent = existingCart.length;
  </script>
  <script src="js/navbar.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
