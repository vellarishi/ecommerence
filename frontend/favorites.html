<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorites — RUCHI</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== Favorites page — scoped styles only ===== */
    .fav-page-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .fav-page-head h1 { margin: 0; }
    .fav-count-tag {
      font-size: .95rem;
      color: var(--ink-soft, #8a8071);
      font-weight: 600;
    }
    .fav-subtext {
      color: var(--ink-soft, #8a8071);
      margin: 4px 0 30px;
      font-size: .98rem;
    }

    /* --- Card grid --- */
    .fav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 22px;
    }
    .fav-card {
      background: #fff;
      border: 1px solid var(--line, #f0e6d8);
      border-radius: 16px;
      overflow: hidden;
      transition: box-shadow .18s ease, transform .18s ease;
    }
    .fav-card:hover {
      box-shadow: 0 10px 28px rgba(43,36,32,.09);
      transform: translateY(-3px);
    }
    .fav-card-media {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }
    .fav-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }
    .fav-card:hover .fav-card-media img {
      transform: scale(1.05);
    }
    /* Category label overlay on top of the photo */
    .fav-card-media .media-tag {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 1;
      color: #fff;
      font-weight: 700;
      font-size: .72rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,.5);
    }
    .fav-card-media::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.55), transparent 55%);
      z-index: 0;
    }
    .fav-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.92);
      color: #c0521f;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      transition: transform .15s ease, background .15s ease;
    }
    .fav-btn:hover {
      background: #fff;
      transform: scale(1.1);
    }
    .fav-card-body {
      padding: 16px 18px 18px;
    }
    .fav-card-body h3 {
      font-size: 1.05rem;
      margin: 0 0 8px;
      color: var(--ink, #2b2420);
    }
    .fav-card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .82rem;
      color: var(--ink-soft, #8a8071);
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .rating-badge {
      background: #eef3ea;
      color: #4c7256;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: .78rem;
    }
    .fav-card-body .price-tag {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent, #c0521f);
      margin: 0;
    }

    /* --- Empty state --- */
    .empty-state {
      text-align: center;
      padding: 70px 20px;
      background: #fff;
      border: 1px dashed var(--line, #e6dcc8);
      border-radius: 16px;
    }
    .empty-state .emoji { font-size: 3rem; margin-bottom: 14px; }
    .empty-state h3 { margin: 0 0 8px; font-size: 1.3rem; }
    .empty-state p { color: var(--ink-soft, #8a8071); margin: 0; }
    .empty-state a { color: var(--accent, #c0521f); font-weight: 600; text-decoration: none; }
    .empty-state a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="logo">Ru<span>chi</span></a>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="restaurants.html">Restaurants</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="orders.html">Orders</a></li>
      <li><a href="favorites.html" class="active">Favorites</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <a href="favorites.html" class="icon-btn" aria-label="Favorites">♥</a>
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        🛒<span class="badge" id="cartCount">0</span>
      </a>
      <a href="login.html" class="btn btn-dark btn-sm">Login</a>
    </div>

    <button class="nav-toggle" aria-label="Menu"><span></span></button>
  </div>
</header>

  <main class="container section">
    <div class="fav-page-head">
      <h1>My Favorites</h1>
      <span class="fav-count-tag" id="favCountTag"></span>
    </div>
    <p class="fav-subtext">Restaurants you've saved for later — order again in one tap.</p>

    <div id="favoritesList"></div>
  </main>

  <script>
    // Real food photos (Unsplash, direct CDN URLs — stable, no attribution required)
    const sampleFavorites = [
      { id: 1, name: "Spice Garden",     cuisine: "South Indian",     rating: 4.5, priceValue: 250, deliveryTime: "30-40 min", label: "SOUTH INDIAN", image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=500&h=375&fit=crop&q=80" },
      { id: 2, name: "Pizza Point",      cuisine: "Italian",          rating: 4.2, priceValue: 450, deliveryTime: "25-35 min", label: "ITALIAN",      image: "https://images.unsplash.com/photo-1565299624946-b28f40a0ca4b?w=500&h=375&fit=crop&q=80" },
      { id: 3, name: "Dragon Wok",       cuisine: "Chinese",          rating: 4.0, priceValue: 300, deliveryTime: "35-45 min", label: "CHINESE",      image: "https://images.unsplash.com/photo-1552611052-33e04de081de?w=500&h=375&fit=crop&q=80" },
      { id: 4, name: "Burger Bay",       cuisine: "Fast Food",        rating: 4.3, priceValue: 150, deliveryTime: "20-30 min", label: "FAST FOOD",    image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&h=375&fit=crop&q=80" },
      { id: 5, name: "Tandoori Nights",  cuisine: "North Indian",     rating: 4.6, priceValue: 380, deliveryTime: "35-50 min", label: "NORTH INDIAN", image: "https://images.unsplash.com/photo-1567188040759-fb8a883dc6d8?w=500&h=375&fit=crop&q=80" },
      { id: 6, name: "Sushi Central",    cuisine: "Japanese",         rating: 4.7, priceValue: 520, deliveryTime: "40-55 min", label: "JAPANESE",     image: "https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?w=500&h=375&fit=crop&q=80" },
      { id: 7, name: "Taco Fiesta",      cuisine: "Mexican",          rating: 4.1, priceValue: 280, deliveryTime: "25-40 min", label: "MEXICAN",      image: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=500&h=375&fit=crop&q=80" },
      { id: 8, name: "Green Bowl",       cuisine: "Healthy / Salads", rating: 4.4, priceValue: 220, deliveryTime: "20-30 min", label: "HEALTHY",      image: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500&h=375&fit=crop&q=80" }
    ];

    function updateFavCountTag(n) {
      const tag = document.getElementById("favCountTag");
      if (tag) tag.textContent = n === 0 ? "" : `${n} saved`;
    }

    function renderFavoritesInline(list) {
      const container = document.getElementById("favoritesList");
      if (!container) return;

      updateFavCountTag(list.length);

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="emoji">♡</div>
            <h3>No favorites yet</h3>
            <p>Browse <a href="restaurants.html">restaurants</a> and tap the heart to save them here!</p>
          </div>`;
        return;
      }

      container.innerHTML = `<div class="fav-grid">` +
        list.map((r) => `
          <div class="fav-card">
            <div class="fav-card-media">
              <img src="${r.image}" alt="${r.name}" loading="lazy">
              <span class="media-tag">${r.label}</span>
              <button class="fav-btn active" data-id="${r.id}" title="Remove from favorites">♥</button>
            </div>
            <div class="fav-card-body">
              <h3>${r.name}</h3>
              <div class="fav-card-meta">
                <span class="rating-badge">⭐ ${r.rating}</span>
                <span>${r.cuisine}</span>
                <span>${r.deliveryTime}</span>
              </div>
              <p class="price-tag">₹${r.priceValue}</p>
            </div>
          </div>
        `).join("") +
        `</div>`;

      document.querySelectorAll(".fav-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          const id = this.getAttribute("data-id");
          const remaining = sampleFavorites.filter((f) => f.id != id);
          renderFavoritesInline(remaining);
        });
      });
    }

    renderFavoritesInline(sampleFavorites);
  </script>

  <script src="js/script.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
